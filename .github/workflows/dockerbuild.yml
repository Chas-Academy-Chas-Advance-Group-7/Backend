name: dockerhub build

on:
  push:
    branches: ["dev", "feature"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build docker
        run: docker build -t express-api:latestLogin ./api

      - name: run di bad man test mahn, mi a fi see di docker be irie mi bredren BOOM. (AKA Run docker)
        run: docker run --rm express-api:latestLogin npm test

      - name: login into di dockerhub ting
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Mark te ting for latea rastaman, yu gwan be irie and smell like marley. Den yu would want di reminder mahn BOMBA. (AKA tag image for dockerhub)
        run: |
          docker tag express-api:latestLogin ${{ secrets.DOCKER_USERNAME }}/chas-advance:latest
          docker tag express-api:latestLogin ${{ secrets.DOCKER_USERNAME }}/chas-advance:${{ github.ref_name }}

      - name: dock ya bad man ting behind and push ti mi scream (AKA push docker to dockerhub)
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/chas-advance:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/chas-advance:${{ github.ref_name }}
