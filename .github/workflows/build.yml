name: CI #namnet på ens workflow

on: #Vad som triggar en workflow
  push:
    branches: ["dev", "feature"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs: #jobs är stegen som körs sekvent av en virtuell maskin
  build:
    runs-on: ubuntu-latest
    steps: # steg i pipelinen
      - uses: actions/checkout@v3 #Hämtar koden från repot
      - name: Use Node.js
        uses: actions/setup-node@v3 #Sätter upp e node enviroment med v20
        with:
          node-version: "20"

      - name: packageInstall
        run: |
          cd api  
          npm install
      - name: typecheck
        run: |
          cd api  
          npm run typecheck
      - name: build
        run: |
          cd api  
          npm run build
  dockerhubbuild:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build docker
        run: docker build -t express-api:latest ./api

      - name: run di bad man test mahn, mi a fi see di docker be irie mi bredren BOOM. (AKA Run docker)
        run: docker run --rm express-api:latest npm test

      - name: login into di dockerhub ting
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Mark te ting for latea rastaman, yu gwan be irie and smell like marley. Den yu would want di reminder mahn BOMBA. (AKA tag image for dockerhub)
        run: |
          docker tag express-api:latest ${{ secrets.DOCKER_USERNAME }}/chas-advance:latest
          docker tag express-api:latest ${{ secrets.DOCKER_USERNAME }}/chas-advance:${{ github.ref_name }}

      - name: dock ya bad man ting behind and push ti mi scream (AKA push docker to dockerhub)
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/chas-advance:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/chas-advance:${{ github.ref_name }}

    #Flytta docker build hit!!!!
