openapi: 3.0.0
info:
  title: Chas-advance
  description: This is the swagger documentation for the functional parts of the Server
  version: 0.2.0

servers:
  - url: http://localhost:3000/
    description: This is the current testing and production environment for this API

paths:
  /:
    get:
      tags:
        - Welcome
      summary: Welcome route
      description: Returns a welcome message to confirm the server is running
      responses:
        "200":
          description: Server is up and responding
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Welcome to the internet, have a look around

  /login_portal:
    get:
      tags:
        - login
      summary: Welcome route for logins
      description: Returns a welcome message
      responses:
        "200":
          description: Returns a string verifying it's working
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Välkommen till login portalen

  /login_portal/user_login:
    get:
      tags:
        - user_login
      summary: Welcome route for user logins
      description: Returns a welcome message
      responses:
        "200":
          description: Returns a string verifying it's working
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Välkommen till user login routen

  /login_portal/user_login/register:
    post:
      tags:
        - user_login
      summary: Register a new user account
      description: Creates a new user account and returns a JWT token upon success.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - user_name
              properties:
                email:
                  type: string
                  example: user@example.com
                password:
                  type: string
                  example: securePassword123
                user_name:
                  type: string
                  example: Frodo Baggins
      responses:
        "201":
          description: User successfully registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: User registered successfully
                  token:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        "400":
          description: Validation error (missing fields, invalid input)
        "500":
          description: Internal server error

  /login_portal/user_login/login:
    post:
      tags:
        - user_login
      summary: Log in a registered user
      description: Authenticates a user and returns a JWT token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  example: user@example.com
                password:
                  type: string
                  example: securePassword123
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Login successful
                  token:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        "400":
          description: Missing required fields
        "401":
          description: Invalid credentials
        "500":
          description: Internal server error

  /login_portal/driver_login:
    get:
      tags:
        - driver_login
      summary: Welcome route for driver logins
      description: Returns a welcome message
      responses:
        "200":
          description: Returns a string verifying it's working
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Välkommen till driver login routen

  /login_portal/driver_login/register:
    post:
      tags:
        - driver_login
      summary: Register a new driver account
      description: Creates a new driver account and returns a JWT token upon success.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - name
              properties:
                email:
                  type: string
                  format: email
                  example: driver@example.com
                password:
                  type: string
                  minLength: 6
                  example: strongPassword123
                name:
                  type: string
                  example: Samwise Gamgee
      responses:
        "201":
          description: Driver successfully registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Driver registered successfully
                  token:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        "400":
          description: Validation error (missing fields, invalid name or password too short)
        "500":
          description: Internal server error

  /login_portal/driver_login/login:
    post:
      tags:
        - driver_login
      summary: Login to a driver account
      description: Authenticates a driver and returns a JWT token upon successful login.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: driver@example.com
                password:
                  type: string
                  example: strongPassword123
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Login successful
                  token:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        "400":
          description: Missing email or password
        "401":
          description: Invalid credentials
        "500":
          description: Internal server error

  /user_portal:
    get:
      tags:
        - user_portal
      summary: This route pertains all actions for senders and recievers
      description: Returns a welcome message
      responses:
        "200":
          description: Returns a string verifying its working
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Välkommen till user portalen

  /user_portal/sender_route:
    get:
      tags:
        - sender_route
      summary: This route pertains all actions for senders
      description: Returns a welcome message
      responses:
        "200":
          description: Returns a string verifying its working
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Välkommen till sender routen
  /user_portal/sender_route/all_packages/{user_id}:
    get:
      tags:
        - sender_route
      summary: View all packages in the system. Where the user is the sender
      description: Retrieve all packages when the user authentication is a success.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          description: Sender user ID
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of packages sent from the user
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    package_id:
                      type: integer
                    sender_id:
                      type: integer
                    receiver_id:
                      type: integer
                    delivery_point_id:
                      type: integer

        "401":
          description: User ID not found
        "500":
          description: Internal server error
  /user_portal/reciever_route:
    get:
      tags:
        - reciever_route
      summary: This route pertains all actions for recievers
      description: Returns a welcome message
      responses:
        "200":
          description: Returns a string verifying its working
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: välkommen till reciever routen

  /user_portal/reciever_route/all_packages/{user_id}:
    get:
      tags:
        - reciever_route
      summary: View all packages in the system. Where the user is the reciever
      description: Retrieve all packages when the user authentication is a succes  .
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          description: receiver_id user ID
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of packages in the progress of recieving by the user
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    sender_id:
                      type: integer
                    receiver_id:
                      type: integer
                    delivery_point_id:
                      type: integer

        "401":
          description: User ID not found
        "500":
          description: Internal server error

  /user_portal/reciever_route/single_package/{user_id}/{package_id}:
    get:
      tags:
        - reciever_route
      summary: Get a single package for a receiver
      description: Retrieve a specific package by package ID for a receiver along with sender and delivery point info.
      security:
        - bearerAuth: []
      parameters:
        - name: user_id
          in: path
          description: Receiver user ID
          required: true
          schema:
            type: integer
        - name: package_id
          in: path
          description: Package ID
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Package details including sender, receiver, and delivery point info
          content:
            application/json:
              schema:
                type: object
                properties:
                  package_id:
                    type: integer
                  sender_id:
                    type: integer
                  receiver_id:
                    type: integer
                  delivery_point_id:
                    type: integer
                  sender_email:
                    type: string
                  sender_name:
                    type: string
                  receiver_email:
                    type: string
                  receiver_name:
                    type: string
                  delivery_address:
                    type: string
                  delivery_postal_code:
                    type: string
                  delivery_city:
                    type: string
        "401":
          description: User ID or Package ID not found
        "500":
          description: Internal server error

  /package_portal:
    get:
      tags:
        - packages
      summary: This route pertains all actions for packages
      description: Returns a welcome message
      responses:
        "200":
          description: Returns a string verifying its working
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Välkommen till paket portalen

  /package_portal/tracking_packages:
    get:
      tags:
        - packages-tracking
      summary: This route pertains all actions for tracking packages
      description: Returns a welcome message
      responses:
        "200":
          description: Returns a string verifying its working
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Välkommen till tracking routen

  /package_portal/sensor_packages:
    get:
      tags:
        - packages-sensor
      summary: This route pertains all actions for package sensors
      description: Returns a welcome message
      responses:
        "200":
          description: Returns a string verifying its working
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: välkommen till sensor routen
  /package_portal/sensor_packages/in_transit_sensor_readings:
  post:
    summary: Insert in-transit sensor readings
    description: >
      Receives sensor telemetry from a truck and stores temperature, humidity, and reading metadata.
      Requires a valid access key.
    tags:
      - Sensors
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - accessKey
              - truck_id
              - sensors
            properties:
              accessKey:
                type: string
                description: Access key to authorize sensor data submission
                example: "ABC123SECRET"
              truck_id:
                type: string
                description: Unique ID of the truck sending the sensor data
                example: "TRUCK_09A81"
              sensors:
                type: array
                description: Array of sensor payloads
                items:
                  type: object
                  required:
                    - sensor_id
                    - data
                  properties:
                    sensor_id:
                      type: string
                      description: Unique sensor identifier
                      example: "TEMP_SENSOR_01"
                    data:
                      type: object
                      required:
                        - temperature
                        - humidity
                      properties:
                        temperature:
                          type: number
                          format: float
                          example: 4.7
                        humidity:
                          type: number
                          format: float
                          example: 61.2
                    stale:
                      type: boolean
                      description: Indicates if the data is stale or delayed
                      example: false
    responses:
      "201":
        description: Sensor readings inserted successfully
        content:
          application/json:
            example:
              message: "Sensor readings inserted successfully."
              truck_id: "TRUCK_09A81"
              data:
                - sensor_id: "TEMP_SENSOR_01"
                  temperature: 4.7
                  humidity: 61.2
                  reading_timestamp: "2025-02-08T12:44:22.000Z"
                  stale: false
      "400":
        description: Missing access key or truck ID
        content:
          application/json:
            example:
              message: "Access key or truck_id is missing"
      "401":
        description: Invalid access key
        content:
          application/json:
            example:
              message: "The access key that was submitted is invalid"
      "500":
        description: Internal server error
        content:
          application/json:
            example:
              message: "Internal server error."


  /employee_portal:
    get:
      tags:
        - employee_portal
      summary: This route pertains all actions for employees
      description: Returns a welcome message
      responses:
        "200":
          description: Returns a string verifying its working
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Välkommen till employee portalen
  /employee_portal/driver_routes:
    get:
      tags:
        - employee_driver
      summary: This route pertains all actions for drivers
      description: Returns a welcome message
      responses:
        "200":
          description: Returns a string verifying its working
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Välkommen till driver routen

  /employee_portal:
  get:
    tags:
      - employee_portal
    summary: This route pertains all actions for employees
    description: Returns a welcome message
    responses:
      "200":
        description: Returns a string verifying its working
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: Välkommen till employee portalen

  /employee_portal/driver_routes:
    get:
      tags:
        - employee_driver
      summary: This route pertains all actions for drivers
      description: Returns a welcome message
      responses:
        "200":
          description: Returns a string verifying its working
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Välkommen till driver routen

  /employee_portal/driver_routes/register_to_truck/{driver_id}/{truck_id}:
    patch:
      summary: Assign or update a driver's truck
      tags:
        - employee_driver
      description: Updates the `truck_id` for an existing driver by their ID. Only the truck assignment changes.
      parameters:
        - in: path
          name: driver_id
          required: true
          schema:
            type: integer
          description: The ID of the driver to update.
          example: 5
        - in: path
          name: truck_id
          required: true
          schema:
            type: integer
          description: The ID of the truck to assign to the driver.
          example: 12
      responses:
        200:
          description: Driver successfully registered to a truck.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Driver successfully registered to truck
                  driver:
                    type: object
                    description: The updated driver record.
                    properties:
                      id:
                        type: integer
                        example: 5
                      name:
                        type: string
                        example: Alex Johnson
                      truck_id:
                        type: integer
                        example: 12
        400:
          description: Invalid or missing driver or truck ID.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Driver Id is required and must be a number
        404:
          description: Driver not found.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Driver not found
        500:
          description: Internal server error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Internal server error

  /employee_portal/driver_routes/load_package/{package_id}/{truck_id}:
    patch:
      summary: Load a package onto a truck
      description: Assigns a package to a truck and updates its status to "loaded for delivery".
      tags:
        - employee_driver
      parameters:
        - in: path
          name: package_id
          schema:
            type: integer
          required: true
          description: ID of the package to be loaded
        - in: path
          name: truck_id
          schema:
            type: integer
          required: true
          description: ID of the truck to load the package onto
      responses:
        "200":
          description: Package successfully loaded onto the truck
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Package succesfully loaded on the truck
                  result:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 123
                      truck_id:
                        type: integer
                        example: 456
                      status:
                        type: string
                        example: loaded for delivery
        "400":
          description: Bad Request (missing or invalid IDs, or package already loaded)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: This package is already loaded onto another truck
        "404":
          description: Package or truck not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: the package or truck you are trying to register could not be found in the database
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Internal server error


  /employee_portal/warehouse_routes:
  get:
    tags:
      - employee_warehouse
    summary: This route pertains all actions for the warehouse
    description: Returns a welcome message
    responses:
      "200":
        description: Returns a string verifying its working
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: Välkommen till warehouse routen

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
